name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-evaluation.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-evaluation.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -p 'test_role*.py' -v
      - name: Run the simulated example
        run: python -m src.role4_evaluation --truth tests/fixtures/role4/simulated_test_manifest.csv --predictions tests/fixtures/role4/simulated_predictions.csv --model SIMULATED_DEMO --seed 0 --threshold 0.50 --outdir outputs/role4/simulated_demo
